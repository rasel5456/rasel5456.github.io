# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: "MD. Rasel Hossen Sawpon"

first_name: "MD. Rasel"
middle_name: "Hossen"
last_name: "Sawpon"

contact_note: >
  Feel free to connect with me through email, LinkedIn, or GitHub.

description: >
  MD. Rasel Hossen Sawpon is a Computer Science and Engineering student at
  Independent University, Bangladesh. His primary interests include Machine
  Learning, Cybersecurity, software development, and future research.

footer_text: >
  © 2026 MD. Rasel Hossen Sawpon. Built with curiosity and code.
  Hosted on <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.

keywords: >
  MD Rasel Hossen Sawpon,
  Rasel Hossen Sawpon,
  Rasel 5456,
  CSE student Bangladesh,
  Independent University Bangladesh,
  IUB CSE student,
  Machine Learning,
  Artificial Intelligence,
  Cybersecurity,
  Information Security,
  Ethical Hacking,
  Secure Software Development,
  Software Developer,
  Future Researcher

lang: en

icon: 💻

apple_touch_icon:

url: https://rasel5456.github.io
baseurl: ""

last_updated: true
back_to_top: true

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

repo_theme_light: default
repo_theme_dark: dark

protect_email: true

repo_trophies:
  enabled: false
  theme_light: flat
  theme_dark: gitdimmed

external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app

# -----------------------------------------------------------------------------
# al-folio settings
# -----------------------------------------------------------------------------

al_folio:
  api_version: 1
  style_engine: tailwind

  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css

  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false

  features:
    cv:
      enabled: true
    distill:
      enabled: true

  compat:
    bootstrap:
      enabled: false
      support_window: v1.0-v1.2
      deprecates_in: v1.3
      removed_in: v2.0

  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false

search_enabled: true
socials_in_search: true
posts_in_search: true
bib_search: true

max_width: 1000px

# -----------------------------------------------------------------------------
# Open Graph and Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true

# Optional social sharing image
# Later you can add an image at:
# assets/img/profile-social.png
#
# Then change this to:
# og_image: /assets/img/profile-social.png

og_image:

# -----------------------------------------------------------------------------
# Analytics and Search Console
# -----------------------------------------------------------------------------

analytics:
  google:
  cronitor:
  pirsch:
  openpanel:
  cloudflare:

enable_simple_analytics: false

# Add your Google Search Console verification code here later
google_site_verification:

bing_site_verification:

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: "Notes, Projects & Learning"

blog_description: >
  My notes, project updates, learning experiences, and future research journey.

permalink: /blog/:year/:title/

lsi: false

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# -----------------------------------------------------------------------------
# Comments
# -----------------------------------------------------------------------------

giscus:
  repo:
  repo_id:
  category: Comments
  category_id:
  mapping: title
  strict: 1
  reactions_enabled: 1
  input_position: bottom
  dark_theme: dark
  light_theme: light
  emit_metadata: 0
  lang: en

disqus_shortname:

# -----------------------------------------------------------------------------
# External sources
# -----------------------------------------------------------------------------

external_sources: []

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false
  endpoint:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  books:
    output: true

  news:
    defaults:
      layout: post
    output: true

  projects:
    output: true

  teachings:
    output: true

# -----------------------------------------------------------------------------
# Default page settings
# -----------------------------------------------------------------------------

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      related_posts: true

  - scope:
      path: ""
      type: books
    values:
      layout: book

  - scope:
      path: ""
      type: projects
    values:
      layout: page

  - scope:
      path: ""
      type: teachings
    values:
      layout: page

# -----------------------------------------------------------------------------
# Build settings
# -----------------------------------------------------------------------------

markdown: kramdown

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - docs
  - test
  - scripts
  - .github
  - .devcontainer

keep_files:
  - .git
  - .nojekyll

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-scholar
